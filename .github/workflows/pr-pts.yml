# PR pipeline — uses Smart Tests predictive test selection (PTS) to run
# only the most relevant subset of the test suite for each push, targeting
# 50% of the original duration. This is the workflow that fires during the
# story-led demo when the developer pushes the fix.
#
# Smart Tests integration follows the CI integration blueprint:
# https://docs.cloudbees.com/docs/cloudbees-smart-tests/latest/references/onboarding-guide#ci-integration-blueprint
name: pr-pts

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
      BUILD_NAME: ${{ github.sha }}
      SESSION_NAME: pr-${{ github.run_number }}
      TEST_SUITE: notifications-api-pr
      PTS_TARGET: "50%"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Smart Tests CLI
        # PyPI package is `smart-tests-cli`; the installed binary is `smart-tests`.
        # See https://pypi.org/project/smart-tests-cli/
        run: pip install --user --upgrade smart-tests-cli

      - name: Verify Smart Tests CLI
        run: smart-tests verify || true

      - name: Record build
        run: smart-tests record build --build "$BUILD_NAME"

      - name: Record session
        run: |
          smart-tests record session \
            --build "$BUILD_NAME" \
            --session "$SESSION_NAME" \
            --test-suite "$TEST_SUITE" \
            --flavor branch=${{ github.ref_name }} \
            --flavor run=pr-pts

      - name: Compile test sources
        # Surefire/PTS need compiled test classes available before subsetting.
        run: ./mvnw -B test-compile

      - name: Generate PTS subset
        run: |
          smart-tests subset maven \
            --session "$SESSION_NAME" \
            --target "$PTS_TARGET" \
            src/test/java > target/pts-subset.txt
          echo "---- selected tests ----"
          wc -l target/pts-subset.txt
          head -20 target/pts-subset.txt

      - name: Run PTS-selected tests
        run: |
          TESTS=$(paste -sd, target/pts-subset.txt)
          ./mvnw -B test -Dtest="${TESTS}" -DfailIfNoTests=false
        continue-on-error: true

      - name: Upload results to Smart Tests
        if: always()
        run: |
          smart-tests record tests maven \
            --session "$SESSION_NAME" \
            ./target/surefire-reports
