# Full test suite — runs nightly on `main`. This is the "overnight run"
# referenced in the story-led demo: developer arrives in the morning to
# find 10 test failures from this workflow.
name: nightly-full

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC nightly
  workflow_dispatch:          # allow manual triggering for demo prep

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      LAUNCHABLE_TOKEN: ${{ secrets.LAUNCHABLE_TOKEN }}
      LAUNCHABLE_ORGANIZATION: ${{ vars.LAUNCHABLE_ORGANIZATION }}
      LAUNCHABLE_WORKSPACE: ${{ vars.LAUNCHABLE_WORKSPACE }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Set up Python (for Smart Tests CLI)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Smart Tests CLI
        run: pip install --upgrade launchable

      - name: Verify Smart Tests setup
        run: launchable verify

      - name: Record build
        run: launchable record build --name "${GITHUB_SHA}"

      - name: Record session (full)
        id: session
        run: |
          SESSION=$(launchable record session \
            --build "${GITHUB_SHA}" \
            --flavor branch=main \
            --flavor run=nightly-full)
          echo "session=${SESSION}" >> "$GITHUB_OUTPUT"

      - name: Run full test suite
        run: ./mvnw -B test

      - name: Upload results to Smart Tests
        if: always()
        run: |
          launchable record tests \
            --session "${{ steps.session.outputs.session }}" \
            maven ./target/surefire-reports
